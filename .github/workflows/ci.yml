name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php-tests:
    name: PHP tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --ignore-platform-reqs

      - name: Run PHPUnit
        run: php vendor/bin/phpunit

  js:
    name: JS build & checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install PHP deps (Flarum core typings for tsc)
        run: composer install --prefer-dist --no-interaction --no-progress --ignore-platform-reqs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS dependencies
        working-directory: js
        run: npm install

      - name: Check formatting
        working-directory: js
        run: npm run format-check

      - name: Check typings
        working-directory: js
        run: npm run check-typings

      - name: Build assets
        working-directory: js
        run: npm run build

      - name: Ensure committed bundle is up to date
        working-directory: js
        run: git diff --exit-code -- dist
